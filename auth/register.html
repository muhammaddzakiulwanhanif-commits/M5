<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f2f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            width: 400px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 15px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2f3e4e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1e2a36;
        }

        .link {
            text-align: center;
            margin-top: 10px;
        }

        .link a {
            text-decoration: none;
            color: #2f3e4e;
        }
    </style>

    <script>
        function validasiRegister() {
            let fname = document.forms["formRegister"]["fname"].value;
            let lname = document.forms["formRegister"]["lname"].value;
            let email = document.forms["formRegister"]["email"].value;
            let phone = document.forms["formRegister"]["phone"].value;
            let password = document.forms["formRegister"]["password"].value;

            if (fname == "") {
                alert("First Name wajib diisi!");
                return false;
            }

            if (lname == "") {
                alert("Last Name wajib diisi!");
                return false;
            }

            if (email == "") {
                alert("Email wajib diisi!");
                return false;
            }

            if (phone == "") {
                alert("Phone wajib diisi!");
                return false;
            }

            if (password == "") {
                alert("Password wajib diisi!");
                return false;
            }

            if (password.length < 8) {
                alert("Password minimal 8 karakter!");
                return false;
            }

            alert("Register berhasil!");
            return false;
        }
    </script>
</head>

<body>

<div class="container">
    <h2>Silahkan Isikan Data</h2>

    <form name="formRegister" onsubmit="return validasiRegister()">

        <label>First Name</label>
        <input type="text" name="fname" placeholder="Masukkan nama depan">

        <label>Middle Name</label>
        <input type="text" name="mname" placeholder="Masukkan nama tengah">

        <label>Last Name</label>
        <input type="text" name="lname" placeholder="Masukkan nama belakang">

        <label>Tanggal Lahir</label>
        <input type="date" name="date">

        <label>Jenis Kelamin</label>
        <div class="radio-group">
            <label><input type="radio" name="gender" value="pria"> Pria</label>
            <label><input type="radio" name="gender" value="wanita"> Wanita</label>
        </div>

        <label>Tempat Tinggal</label>
        <input list="kota" name="kota" placeholder="Pilih kota">

        <datalist id="kota">
            <option value="Medan">
            <option value="Sunggal">
            <option value="Pekanbaru">
            <option value="Helvetia">
            <option value="Johor">
        </datalist>

        <label>Email</label>
        <input type="email" name="email" placeholder="example@email.com">

        <label>Phone</label>
        <input type="text" name="phone" placeholder="08XXX">

        <label>Password</label>
        <input type="password" name="password" placeholder="Minimal 8 karakter">

        <button type="submit">Daftar</button>

        <div class="link">
            <a href="login.html">Sudah punya akun? Login</a>
            <br>
            <a href="#">Lupa Password?</a>
        </div>

    </form>
</div>

</body>
</html>
